[project]
name = "sancho"
version = "0.0.0"
description = "Asistente personal con presencia física y digital."
readme = "README.md"
# Python 3.12 para todos los componentes de E0 (ADR-0012).
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.2.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "contracts", "body", "brain", "sim", "eval"]
pythonpath = ["."]
addopts = "--strict-markers -rs -m 'not nano'"
markers = [
    "nano: requiere el Jetson Nano (cámara CSI, GPU o TensorRT); excluida por defecto",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
