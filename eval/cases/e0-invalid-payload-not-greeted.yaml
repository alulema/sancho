id: e0-invalid-payload-not-greeted
version: "0.3"
description: >-
  Un person_entered con sobre válido pero payload fuera de contrato (confianza 1,7 y
  sin bbox) no produce saludo: lo impide la validación, no la regla.
tags: [e0, validation, security]
lang: es
when:
  - at_ms: 0
    publish:
      topic: sancho/body/vision/evt/person_entered
      payload: { track_id: "t1", confidence: 1.7 }
forbid:
  - topic: sancho/body/speech/cmd/say
    count_gt: 0
    within_ms: 2000
